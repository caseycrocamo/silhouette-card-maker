<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silhouette Card Maker - Home</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script type="text/javascript" src="../shared/navbar.js"></script>
    <script type="text/javascript" src="home.js"></script>
</head>
<body class="min-h-screen bg-surface text-content">
    <nav-bar current-step="1"></nav-bar>

    <main class="container mx-auto px-4 pt-24 pb-8 max-w-6xl">
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Calibration Notice -->
        <div id="calibrationNotice" class="hidden paper-element mb-12 p-6">
            <h2 class="text-xl font-semibold text-primary-dark mb-2">Printer Calibration Recommended</h2>
            <p class="text-content mb-4">No saved printer offsets were found. Run calibration to keep your cards aligned to the cut guides.</p>
            <div class="flex flex-wrap gap-4">
                <button class="paper-button" onclick="location.href='../Settings/settings.html'">Go to Settings</button>
                <a id="calibrationDocsLink" href="https://alan-cha.github.io/silhouette-card-maker/docs/offset/" class="paper-button inline-flex items-center justify-center">View Calibration Guide</a>
            </div>
        </div>

        <!-- Header -->
    <header class="paper-element text-center mb-12 p-8">
            <h1 class="text-4xl font-bold text-primary-dark mb-4">Welcome to Silhouette Card Maker</h1>
            <p class="text-primary text-lg mb-8">Create custom playing cards for your favorite games</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
                <button class="paper-button flex items-center justify-center gap-2" 
                        onclick="location.href='../MagicTheGathering/decklist.html'">
                    Magic the Gathering
                </button>
                <button class="paper-button flex items-center justify-center gap-2"
                        onclick="location.href='../MagicTheGathering/text_translation.html'">
                    MTG Text Translation
                </button>
            </div>
    </header>
</body>
</html>
