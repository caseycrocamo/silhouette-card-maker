<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cutting templates</title><link rel="stylesheet" href="../styles/main.css"><link rel="stylesheet" href="tools.css"><script src="../shared/navbar.js"></script><script defer src="templates.js"></script></head>
<body class="min-h-screen bg-surface text-content"><nav-bar current-step="4"></nav-bar><main class="container mx-auto px-4 pt-24 pb-8 max-w-5xl">
<section class="paper-element p-6 mb-6"><h1 class="text-2xl font-semibold mb-2">DXF cutting templates</h1><p>Create a cutting file for a card and paper size.</p><div id="catalogError" role="alert"></div>
<form id="templateForm" class="template-grid">
<fieldset><legend>Card</legend><label><input type="radio" name="cardMode" value="named" checked> Named size</label><select class="paper-input" id="cardSize"></select><label><input type="radio" name="cardMode" value="custom"> Custom dimensions</label><div class="pair"><label>Width <input class="paper-input" id="cardWidth" placeholder="63mm"></label><label>Height <input class="paper-input" id="cardHeight" placeholder="88mm"></label></div><label>Corner radius <input class="paper-input" id="cardRadius" placeholder="3mm"></label><label>Card label <input class="paper-input" id="cardName"></label></fieldset>
<fieldset><legend>Paper</legend><label><input type="radio" name="paperMode" value="named" checked> Named size</label><select class="paper-input" id="paperSize"></select><label><input type="radio" name="paperMode" value="custom"> Custom dimensions</label><div class="pair"><label>Width <input class="paper-input" id="paperWidth" placeholder="8.5in"></label><label>Height <input class="paper-input" id="paperHeight" placeholder="11in"></label></div><label>Paper label <input class="paper-input" id="paperName"></label></fieldset>
<fieldset><legend>Template</legend><label>Variant <select class="paper-input" id="variant"><option value="default">Default</option><option value="borderless">Borderless</option></select></label><label>Orientation <select class="paper-input" id="orientation"><option value="optimize">Optimize</option><option value="landscape">Landscape</option><option value="portrait">Portrait</option></select></label><label><input id="saveLayout" type="checkbox" checked> Save new sizes and layout for PDF settings</label></fieldset>
<section class="template-actions"><label>DXF file <input class="paper-input" id="outputFile" readonly></label><button class="paper-button" type="button" id="chooseFile">Choose DXF file</button><label>Batch output folder <input class="paper-input" id="outputDir" readonly></label><button class="paper-button" type="button" id="chooseFolder">Choose folder</button><button class="paper-button" type="submit">Generate DXF</button><button class="paper-button" type="button" id="batchMissing">Generate missing</button><button class="paper-button" type="button" id="batchAll">Regenerate all</button><button class="paper-button" type="button" id="batchOptimize">Optimize all</button><button class="paper-button" type="button" id="cancel">Cancel batch</button></section>
</form><progress id="progress" class="hidden" max="1" value="0"></progress><p id="status" role="status" aria-live="polite"></p><div id="results"></div></section></main></body></html>
