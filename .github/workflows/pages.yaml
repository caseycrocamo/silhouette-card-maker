name: Build and deploy Hugo site

on:
  push:
    branches: [main]
    paths:
      - 'hugo/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.3
    outputs:
      pages_deploy: ${{ steps.pages.outputs.deploy }}
      page_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Detect optional Pages deployment
        id: pages
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const fallback = repo.toLowerCase() === `${owner}.github.io`.toLowerCase()
              ? `https://${owner}.github.io/`
              : `https://${owner}.github.io/${repo}/`;
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              if (!data.html_url) {
                throw new Error('GitHub Pages is configured, but the API returned no html_url.');
              }
              const pageUrl = new URL(data.html_url);
              if (pageUrl.protocol !== 'https:') {
                throw new Error(`GitHub Pages returned an unexpected URL: ${data.html_url}`);
              }
              const baseUrl = pageUrl.toString().endsWith('/') ? pageUrl.toString() : `${pageUrl.toString()}/`;
              core.setOutput('base_url', baseUrl);
              if (data.build_type === 'workflow') {
                core.setOutput('deploy', 'true');
                core.notice(`GitHub Pages is configured for Actions at ${baseUrl}; the site will be deployed after the build.`);
              } else {
                core.setOutput('deploy', 'false');
                core.notice(`GitHub Pages is configured at ${baseUrl} with build source "${data.build_type || 'unknown'}". The site will be built and uploaded, but not deployed. To enable Actions deployment, change the Pages source to GitHub Actions in repository Settings > Pages.`);
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.setOutput('deploy', 'false');
              core.setOutput('base_url', fallback);
              core.notice(`GitHub Pages is not configured for ${owner}/${repo}. The Hugo site will still be built and uploaded with base URL ${fallback}. Enable Pages with the GitHub Actions source in repository Settings > Pages to deploy it.`);
            }
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Setup Hugo
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - name: Build with Hugo
        working-directory: hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "$HUGO_BASE_URL"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hugo/public

  deploy:
    if: needs.build.outputs.pages_deploy == 'true'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
