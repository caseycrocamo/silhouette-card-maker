name: Isolated integration tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run each test in a fresh container
        run: python3 scripts/test-integration.py --results integration-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: integration-results.json
          if-no-files-found: warn
