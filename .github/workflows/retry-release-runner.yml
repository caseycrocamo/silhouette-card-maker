name: Retry release runner allocation

on:
  workflow_run:
    workflows: [Build and publish application release]
    types: [completed]

permissions: {}

jobs:
  retry:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: retry-release-runner-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run's SHA is on the default branch, not the release tag.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retry the Apple Silicon job if no runner picked it up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/retry-release-runner.js
