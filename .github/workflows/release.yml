name: Build and publish application release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: mode
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - id: version
        shell: bash
        run: |
          node -e 'const p=require("./GUI/package.json"); const tag=process.env.GITHUB_REF_NAME; if(process.env.GITHUB_EVENT_NAME==="push" && tag!==`v${p.version}`) { console.error(`Tag ${tag} must match v${p.version}`); process.exit(1); } if(!/^\d+\.\d+\.\d+$/.test(p.version)) { console.error(`A stable X.Y.Z package version is required; received ${p.version}`); process.exit(1); } console.log(`Release version ${p.version}`);'
          echo "version=$(node -p "require('./GUI/package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: win
            arch: x64
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: macos-x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: macos-arm64
            os: macos-14
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: GUI/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI dependencies
        working-directory: GUI
        run: npm ci
      - name: Build CSS
        working-directory: GUI
        run: npm run build:css
      - name: Run Node compatibility checks
        run: npm test
      - name: Test release metadata verification
        working-directory: GUI
        run: npm run test:release
      - name: Exercise real Electron update UI and IPC
        if: matrix.platform == 'win'
        run: node GUI/node_modules/electron/cli.js tests/update-ui-smoke.cjs
      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build native Python entrypoints
        run: npm run build:entrypoints
      - name: Stage native Python entrypoints
        run: npm run copy:entrypoints
      - name: Run Python PDF worker compatibility checks
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build installers and archives without publishing
        working-directory: GUI
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify this target's artifacts
        if: matrix.platform != 'mac'
        working-directory: GUI
        shell: bash
        run: node ../scripts/verify-release.js dist "${{ needs.validate-tag.outputs.version }}" "${{ matrix.platform }}"
      - name: Exercise real NSIS discovery and download
        if: matrix.platform == 'win'
        run: node GUI/node_modules/electron/cli.js tests/update-download-smoke.cjs
      - name: Stage only distributable release files
        shell: bash
        run: |
          mkdir -p release-upload
          find GUI/dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.blockmap' -o -name 'latest.yml' -o -name 'latest-linux.yml' \) -exec cp -f {} release-upload/ \;
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate-tag, build]
    if: needs.validate-tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install release verifier dependencies
        working-directory: GUI
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release set
        run: node scripts/verify-release.js release-assets "${{ needs.validate-tag.outputs.version }}"
      - name: Create draft and upload complete asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: caseycrocamo/silhouette-card-maker
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
        shell: bash
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf 'Silhouette Card Maker %s\n\nSee the attached platform installers and archives.' "$RELEASE_VERSION" > "$notes_file"
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --draft --verify-tag --title "Silhouette Card Maker $RELEASE_VERSION" --notes-file "$notes_file"
      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: caseycrocamo/silhouette-card-maker
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
