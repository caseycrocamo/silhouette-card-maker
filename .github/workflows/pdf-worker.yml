name: PDF worker compatibility

on:
  push:
    paths:
      - '*.py'
      - '*.js'
      - 'build_entrypoints.*'
      - 'requirements.txt'
      - 'package.json'
      - 'GUI/**'
      - 'assets/**'
      - 'plugins/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/pdf-worker.yml'
  pull_request:
    paths:
      - '*.py'
      - '*.js'
      - 'build_entrypoints.*'
      - 'requirements.txt'
      - 'package.json'
      - 'GUI/**'
      - 'assets/**'
      - 'plugins/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/pdf-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI and updater test dependencies
        working-directory: GUI
        run: npm ci
      - name: Build shared styles
        working-directory: GUI
        run: npm run build:css
      - name: Exercise Windows update UI without hardware acceleration
        if: runner.os == 'Windows'
        run: node GUI/node_modules/electron/cli.js tests/update-ui-smoke.cjs
      - name: Exercise Windows updater transport with a local fixture
        if: runner.os == 'Windows'
        run: node GUI/node_modules/electron/cli.js tests/update-download-smoke.cjs --fixture
      - name: Check entrypoints and packaged paths
        run: npm test
      - name: Install worker build dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Freeze the PDF worker
        run: python -m PyInstaller --noconfirm --onefile --add-data "assets:assets" --distpath . pdf_worker.py
      - name: Create, offset, and reuse PDFs with Unicode paths
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run GUI backend parity checks
        run: npm run test:gui-backends
